    <script>
        // Função para atualizar a data e hora a cada segundo
        function updateDateTime() {
            const now = new Date();
            
            // Formatar data atual como dd/mm/yyyy
            const date = now.toLocaleDateString('pt-BR');
            
            // Formatar hora atual como hh:mm:ss
            const time = now.toLocaleTimeString('pt-BR');
            
            // Atualizar data e hora na página
            document.getElementById('currentDateTime').value = date; // Data no campo de input
            document.getElementById('currentClock').textContent = time; // Hora no span
        }

        window.onload = function() {
            updateDateTime(); // Atualiza imediatamente quando a página carrega
            setInterval(updateDateTime, 1000); // Atualiza a cada segundo
        };
    </script>
